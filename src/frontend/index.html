<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipForVRChat</title>
    <style>
      :root {
        color: #17212b;
        background: #edf3f7;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
      }
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .boot-panel {
        width: min(460px, 100%);
        display: grid;
        gap: 14px;
        padding: 24px;
        border: 1px solid #d6dee7;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 52px rgba(23, 33, 43, 0.16);
      }
      .boot-panel h1 {
        margin: 0;
        font-size: 22px;
      }
      .boot-panel p {
        margin: 0;
        color: #455361;
      }
      .boot-progress {
        position: relative;
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: #d9e3ea;
      }
      .boot-progress span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 44%;
        border-radius: inherit;
        background: #2478a9;
        animation: boot-progress 1.1s ease-in-out infinite;
      }
      @keyframes boot-progress {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(230%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-screen" class="boot-screen" role="status" aria-live="polite">
        <div class="boot-panel">
          <h1>ClipForVRChat</h1>
          <p id="boot-status">HTMLを読み込みました。フロントエンドを起動しています。</p>
          <div class="boot-progress"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/autoPostConfirmationDiffPatch.js"></script>
  </body>
</html>
