name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.12.0"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required files
        run: |
          test -s README.md
          test -s src/SPEC.md
          test -s LICENSE
          test -s src/build/appicon.png
          test -s src/build/icons/appicon-16.png
          test -s src/build/icons/appicon-256.png

      - name: Check project name references
        run: |
          grep -q "ClipForVRChat" README.md
          grep -q "ClipForVRChat" src/SPEC.md

  build:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: src/frontend
        run: npm audit --omit=dev

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Check frontend template literals
        run: node scripts/check-frontend-template-literals.mjs

      - name: Check Wails API surface
        run: node scripts/check-wails-api-surface.mjs

      - name: Test Go packages
        working-directory: src
        run: go test ./...

      - name: Check Go vulnerabilities
        working-directory: src
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      - name: Build Spout helper
        shell: pwsh
        run: |
          cmake -S tools/spout-capture -B build/spout-capture -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/spout-capture --config Release --target spout-capture

      - name: Check Spout helper
        shell: pwsh
        run: |
          $helper = Get-ChildItem build/spout-capture -Recurse -Filter spout-capture.exe | Select-Object -First 1
          if (!$helper) {
            throw "spout-capture.exe was not created"
          }
          $spoutDll = Join-Path $helper.DirectoryName "SpoutLibrary.dll"
          if (!(Test-Path $spoutDll)) {
            throw "SpoutLibrary.dll was not copied next to spout-capture.exe"
          }
          & $helper.FullName --help
          & $helper.FullName --version
          & $helper.FullName --list-senders

      - name: Stage embedded Spout helper
        shell: pwsh
        run: |
          $helper = Get-ChildItem build/spout-capture -Recurse -Filter spout-capture.exe | Select-Object -First 1
          if (!$helper) {
            throw "spout-capture.exe was not created"
          }
          $spoutDll = Join-Path $helper.DirectoryName "SpoutLibrary.dll"
          if (!(Test-Path $spoutDll)) {
            throw "SpoutLibrary.dll was not copied next to spout-capture.exe"
          }
          $embedDir = "src/internal/appcore/embedded_spout_assets"
          New-Item -ItemType Directory -Force $embedDir | Out-Null
          Copy-Item $helper.FullName (Join-Path $embedDir "spout-capture.exe") -Force
          Copy-Item $spoutDll (Join-Path $embedDir "SpoutLibrary.dll") -Force

      - name: Test embedded Spout helper extraction
        working-directory: src
        run: go test -tags embeddedspout ./internal/appcore -run TestResolveEmbeddedSpoutHelperWithEmbeddedAssets -count=1

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Check Wails
        run: wails version

      - name: Build application
        working-directory: src
        shell: pwsh
        timeout-minutes: 20
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $releaseTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          node ../scripts/write-wails-info.mjs "ci" wails.json
          node ../scripts/write-wails-windows-info.mjs "ci" $shortSha build/windows/info.json
          wails build -v 2 -m -nosyncgomod -skipbindings -webview2 browser -tags embeddedspout -ldflags "-X main.version=ci -X main.revision=$shortSha -X main.releaseTime=$releaseTime -X main.buildChannel=ci"

      - name: Check executable
        working-directory: src
        shell: pwsh
        run: |
          if (!(Test-Path "build/bin/ClipForVRChat.exe")) {
            throw "build/bin/ClipForVRChat.exe was not created"
          }

      - name: Package AvatarBeacon source zip
        shell: pwsh
        run: |
          $sourceRoot = "avatar-gimmicks/AvatarBeacon"
          if (!(Test-Path $sourceRoot)) {
            throw "AvatarBeacon source root was not found: $sourceRoot"
          }
          $zipName = "AvatarBeacon-ci-source.zip"
          $zipPath = Join-Path "dist" $zipName
          $shaPath = "$zipPath.sha256"
          $checkDir = Join-Path $env:RUNNER_TEMP "avatarbeacon-source-check"
          Remove-Item -Recurse -Force $checkDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          $items = Get-ChildItem $sourceRoot -Force
          if (!$items) {
            throw "AvatarBeacon source root is empty: $sourceRoot"
          }
          Compress-Archive -Path $items.FullName -DestinationPath $zipPath -Force
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content -Encoding ASCII $shaPath
          Expand-Archive $zipPath -DestinationPath $checkDir
          $required = @(
            "README.md",
            "Assets/PoppoWorks/AvatarBeacon",
            "Assets/PoppoWorks/AvatarBeacon/README.md",
            "Assets/PoppoWorks/AvatarBeacon/LICENSES/YL-ATG-MIT.txt"
          )
          foreach ($path in $required) {
            if (!(Test-Path (Join-Path $checkDir $path))) {
              throw "Required AvatarBeacon source file was not created: $path"
            }
          }
          $unexpected = Get-ChildItem $checkDir -Recurse -Force | Where-Object {
            $_.Name -like "*.unitypackage" -or
            $_.FullName -match '([\\/])(Library|Temp)([\\/]|$)' -or
            $_.FullName -match 'VRCSDK|Modular[ _-]?Avatar|ModularAvatar'
          }
          if ($unexpected) {
            $unexpected | ForEach-Object { Write-Error "Unexpected file in AvatarBeacon source zip: $($_.FullName)" }
            throw "Unexpected files were found in AvatarBeacon source zip"
          }
          $shaLine = Get-Content -Raw $shaPath
          if ($shaLine.Trim() -ne "$hash  $zipName") {
            throw "AvatarBeacon source zip sha256 file does not match"
          }

      - name: Upload AvatarBeacon source artifact
        uses: actions/upload-artifact@v6
        with:
          name: avatarbeacon-source-ci
          path: |
            dist/AvatarBeacon-ci-source.zip
            dist/AvatarBeacon-ci-source.zip.sha256
