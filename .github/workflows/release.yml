name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v0.1.8-a1, v0.1.8-b1, v0.1.8-rc1, or v0.1.8"
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.12.0"
  GOVULNCHECK_VERSION: "v1.1.4"
  AVATARBEACON_PACKAGE_URL: "https://github.com/hatolife/AvatarBeacon/releases/download/v0.0.1/AvatarBeacon_v0.0.1.unitypackage"
  AVATARBEACON_PACKAGE_NAME: "AvatarBeacon_v0.0.1.unitypackage"
  AVATARBEACON_PACKAGE_SIGNATURE_URL: "https://github.com/hatolife/AvatarBeacon/releases/download/v0.0.1/AvatarBeacon_v0.0.1.unitypackage.asc"
  AVATARBEACON_PACKAGE_SIGNATURE_NAME: "AvatarBeacon_v0.0.1.unitypackage.asc"
  RELEASE_SIGNING_FINGERPRINT: "BE40AA8D082F493F613BC07221DC34861B40E77D"
  RELEASE_SIGNING_KEY_UID: "release-signing@hato.life"
  RELEASE_SIGNING_KEY_URL: "https://keys.openpgp.org/vks/v1/by-fingerprint/BE40AA8D082F493F613BC07221DC34861B40E77D"

jobs:
  build:
    name: Build exe and package release assets
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.version.outputs.version }}
      asset_prefix: ${{ steps.version.outputs.asset_prefix }}
      draft: ${{ steps.version.outputs.draft }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Prepare version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
        run: |
          $tagName = $env:TAG_NAME
          if ($tagName -notmatch '^v\d+\.\d+\.\d+(-(a|b|rc)\d+)?$') {
            throw "Release tag must match vX.Y.Z, vX.Y.Z-aN, vX.Y.Z-bN, or vX.Y.Z-rcN: $tagName"
          }
          $commitSha = git rev-parse HEAD
          $shortSha = git rev-parse --short=7 HEAD
          $releaseTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $isPrerelease = $tagName -match '^v\d+\.\d+\.\d+-(a|b|rc)\d+$'
          $assetPrefix = "ClipForVRChat-$tagName"
          "app_version=$tagName.$shortSha" >> $env:GITHUB_OUTPUT
          "version=$tagName" >> $env:GITHUB_OUTPUT
          "commit_sha=$commitSha" >> $env:GITHUB_OUTPUT
          "revision=$shortSha" >> $env:GITHUB_OUTPUT
          "release_time=$releaseTime" >> $env:GITHUB_OUTPUT
          "asset_prefix=$assetPrefix" >> $env:GITHUB_OUTPUT
          "draft=false" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: src/frontend
        run: npm audit --omit=dev

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Check frontend template literals
        run: node scripts/check-frontend-template-literals.mjs

      - name: Check Vue runtime template
        run: node scripts/check-vue-runtime-template.mjs

      - name: Test Go packages
        working-directory: src
        run: go test ./...

      - name: Check Go vulnerabilities
        working-directory: src
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      - name: Build Spout helper
        shell: pwsh
        run: |
          cmake -S tools/spout-capture -B build/spout-capture -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/spout-capture --config Release --target spout-capture

      - name: Stage embedded Spout helper
        id: spout
        shell: pwsh
        run: |
          $spoutHelper = Get-ChildItem "build/spout-capture" -Recurse -Filter "spout-capture.exe" | Select-Object -First 1
          if (!$spoutHelper) {
            throw "spout-capture.exe was not created"
          }
          $spoutDll = Join-Path $spoutHelper.DirectoryName "SpoutLibrary.dll"
          if (!(Test-Path $spoutDll)) {
            throw "SpoutLibrary.dll was not copied next to spout-capture.exe"
          }
          $embedDir = "src/internal/appcore/embedded_spout_assets"
          New-Item -ItemType Directory -Force $embedDir | Out-Null
          Copy-Item $spoutHelper.FullName (Join-Path $embedDir "spout-capture.exe") -Force
          Copy-Item $spoutDll (Join-Path $embedDir "SpoutLibrary.dll") -Force
          $helperHash = (Get-FileHash (Join-Path $embedDir "spout-capture.exe") -Algorithm SHA256).Hash.ToLower()
          $dllHash = (Get-FileHash (Join-Path $embedDir "SpoutLibrary.dll") -Algorithm SHA256).Hash.ToLower()
          "helper_path=$($spoutHelper.FullName)" >> $env:GITHUB_OUTPUT
          "dll_path=$spoutDll" >> $env:GITHUB_OUTPUT
          "helper_sha256=$helperHash" >> $env:GITHUB_OUTPUT
          "dll_sha256=$dllHash" >> $env:GITHUB_OUTPUT

      - name: Test embedded Spout helper extraction
        working-directory: src
        run: go test -tags embeddedspout ./internal/appcore -run TestResolveEmbeddedSpoutHelperWithEmbeddedAssets -count=1

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Check Wails
        run: wails version

      - name: Prepare Windows version info
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_REVISION: ${{ steps.version.outputs.revision }}
        run: |
          node scripts/write-wails-info.mjs "$env:APP_VERSION" src/wails.json
          node scripts/write-wails-windows-info.mjs "$env:APP_VERSION" "$env:APP_REVISION" src/build/windows/info.json

      - name: Build application
        working-directory: src
        shell: pwsh
        timeout-minutes: 20
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_REVISION: ${{ steps.version.outputs.revision }}
          APP_RELEASE_TIME: ${{ steps.version.outputs.release_time }}
        run: wails build -v 2 -m -nosyncgomod -skipbindings -webview2 browser -tags embeddedspout -ldflags "-X main.version=$env:APP_VERSION -X main.revision=$env:APP_REVISION -X main.releaseTime=$env:APP_RELEASE_TIME -X main.buildChannel=release"

      - name: Download AvatarBeacon package
        id: avatarbeacon
        shell: pwsh
        env:
          AVATARBEACON_PACKAGE_URL: ${{ env.AVATARBEACON_PACKAGE_URL }}
          AVATARBEACON_PACKAGE_NAME: ${{ env.AVATARBEACON_PACKAGE_NAME }}
          AVATARBEACON_PACKAGE_SIGNATURE_URL: ${{ env.AVATARBEACON_PACKAGE_SIGNATURE_URL }}
          AVATARBEACON_PACKAGE_SIGNATURE_NAME: ${{ env.AVATARBEACON_PACKAGE_SIGNATURE_NAME }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $packagePath = "dist/$env:AVATARBEACON_PACKAGE_NAME"
          $signaturePath = "dist/$env:AVATARBEACON_PACKAGE_SIGNATURE_NAME"
          Invoke-WebRequest -Uri $env:AVATARBEACON_PACKAGE_URL -OutFile $packagePath
          Invoke-WebRequest -Uri $env:AVATARBEACON_PACKAGE_SIGNATURE_URL -OutFile $signaturePath
          if (!(Test-Path $packagePath)) {
            throw "AvatarBeacon package was not downloaded: $packagePath"
          }
          $item = Get-Item $packagePath
          if ($item.Length -le 0) {
            throw "AvatarBeacon package is empty: $packagePath"
          }
          if (!(Test-Path $signaturePath)) {
            throw "AvatarBeacon package signature was not downloaded: $signaturePath"
          }
          $signatureItem = Get-Item $signaturePath
          if ($signatureItem.Length -le 0) {
            throw "AvatarBeacon package signature is empty: $signaturePath"
          }
          $hash = (Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLower()
          $signatureHash = (Get-FileHash $signaturePath -Algorithm SHA256).Hash.ToLower()
          "package_path=$packagePath" >> $env:GITHUB_OUTPUT
          "package_name=$env:AVATARBEACON_PACKAGE_NAME" >> $env:GITHUB_OUTPUT
          "package_url=$env:AVATARBEACON_PACKAGE_URL" >> $env:GITHUB_OUTPUT
          "package_sha256=$hash" >> $env:GITHUB_OUTPUT
          "signature_path=$signaturePath" >> $env:GITHUB_OUTPUT
          "signature_name=$env:AVATARBEACON_PACKAGE_SIGNATURE_NAME" >> $env:GITHUB_OUTPUT
          "signature_url=$env:AVATARBEACON_PACKAGE_SIGNATURE_URL" >> $env:GITHUB_OUTPUT
          "signature_sha256=$signatureHash" >> $env:GITHUB_OUTPUT

      - name: Verify AvatarBeacon package signature
        shell: bash
        env:
          AVATARBEACON_PACKAGE_PATH: ${{ steps.avatarbeacon.outputs.package_path }}
          AVATARBEACON_PACKAGE_SIGNATURE_PATH: ${{ steps.avatarbeacon.outputs.signature_path }}
          RELEASE_SIGNING_FINGERPRINT: ${{ env.RELEASE_SIGNING_FINGERPRINT }}
          RELEASE_SIGNING_KEY_UID: ${{ env.RELEASE_SIGNING_KEY_UID }}
          RELEASE_SIGNING_KEY_URL: ${{ env.RELEASE_SIGNING_KEY_URL }}
        run: |
          package_path="${AVATARBEACON_PACKAGE_PATH//\\//}"
          signature_path="${AVATARBEACON_PACKAGE_SIGNATURE_PATH//\\//}"
          expected_fingerprint="$(printf '%s' "$RELEASE_SIGNING_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -s "$package_path"
          test -s "$signature_path"
          if [[ ! "$expected_fingerprint" =~ ^[0-9A-F]{40}$ ]]; then
            echo "RELEASE_SIGNING_FINGERPRINT must be a 40-character OpenPGP fingerprint" >&2
            exit 1
          fi

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          curl --fail --location --silent --show-error "$RELEASE_SIGNING_KEY_URL" --output release-signing-public-key.asc
          gpg --batch --import release-signing-public-key.asc

          key_listing="$(gpg --batch --with-colons --fingerprint "$expected_fingerprint")"
          actual_fingerprint="$(printf '%s\n' "$key_listing" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "release-signing key fingerprint mismatch: expected $expected_fingerprint but imported $actual_fingerprint" >&2
            exit 1
          fi
          if ! printf '%s\n' "$key_listing" | grep -Fq "$RELEASE_SIGNING_KEY_UID"; then
            echo "release-signing key UID was not found: $RELEASE_SIGNING_KEY_UID" >&2
            exit 1
          fi

          if ! gpg --batch --status-fd 1 --verify "$signature_path" "$package_path" > gpg-verify-status.txt 2>&1; then
            cat gpg-verify-status.txt
            exit 1
          fi
          cat gpg-verify-status.txt
          if ! awk -v expected="$expected_fingerprint" '
            $1 == "[GNUPG:]" && $2 == "VALIDSIG" {
              signer = toupper($3)
              primary = toupper($NF)
              if (signer == expected || primary == expected) {
                found = 1
              }
            }
            END { exit found ? 0 : 1 }
          ' gpg-verify-status.txt; then
            echo "AvatarBeacon package signature was not made by the expected release-signing key" >&2
            exit 1
          fi

      - name: Prepare package directory
        shell: pwsh
        env:
          ASSET_PREFIX: ${{ steps.version.outputs.asset_prefix }}
          SPOUT_HELPER_PATH: ${{ steps.spout.outputs.helper_path }}
          SPOUT_DLL_PATH: ${{ steps.spout.outputs.dll_path }}
          AVATARBEACON_PACKAGE_PATH: ${{ steps.avatarbeacon.outputs.package_path }}
        run: |
          if (!(Test-Path "src/build/bin/ClipForVRChat.exe")) {
            throw "src/build/bin/ClipForVRChat.exe was not created"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "src/build/bin/ClipForVRChat.exe" "dist/$env:ASSET_PREFIX-windows-amd64.exe" -Force
          New-Item -ItemType Directory -Force "dist/ClipForVRChat" | Out-Null
          Copy-Item "src/build/bin/ClipForVRChat.exe" "dist/ClipForVRChat/"
          Copy-Item $env:SPOUT_HELPER_PATH "dist/ClipForVRChat/"
          Copy-Item $env:SPOUT_DLL_PATH "dist/ClipForVRChat/"
          Copy-Item "README.md" "dist/ClipForVRChat/"
          Copy-Item "LICENSE" "dist/ClipForVRChat/"
          Copy-Item "third_party/Spout2-LICENSE.txt" "dist/ClipForVRChat/"
          Copy-Item $env:AVATARBEACON_PACKAGE_PATH "dist/ClipForVRChat/"
          @(
            "[InternetShortcut]",
            "URL=https://keys.openpgp.org/search?q=release-signing@hato.life"
          ) | Set-Content -Encoding ASCII "dist/ClipForVRChat/Release-signing-public-key.url"
          New-Item -ItemType Directory -Force "dist/ClipForVRChat-user-package" | Out-Null
          Copy-Item "src/build/bin/ClipForVRChat.exe" "dist/ClipForVRChat-user-package/"
          Copy-Item "README.md" "dist/ClipForVRChat-user-package/"
          Copy-Item "LICENSE" "dist/ClipForVRChat-user-package/"
          Copy-Item $env:AVATARBEACON_PACKAGE_PATH "dist/ClipForVRChat-user-package/"
          Copy-Item "dist/ClipForVRChat/Release-signing-public-key.url" "dist/ClipForVRChat-user-package/"

      - name: Sign executable
        shell: bash
        env:
          ASSET_PREFIX: ${{ steps.version.outputs.asset_prefix }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.CI_RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.CI_RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_FINGERPRINT: ${{ secrets.CI_RELEASE_GPG_FINGERPRINT }}
        run: |
          test -n "$RELEASE_GPG_PRIVATE_KEY"
          test -n "$RELEASE_GPG_PASSPHRASE"
          test -n "$RELEASE_GPG_FINGERPRINT"
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$RELEASE_GPG_FINGERPRINT" \
            --armor --detach-sign \
            --output "dist/${ASSET_PREFIX}-windows-amd64.exe.asc" \
            "dist/${ASSET_PREFIX}-windows-amd64.exe"
          gpg --batch --verify \
            "dist/${ASSET_PREFIX}-windows-amd64.exe.asc" \
            "dist/${ASSET_PREFIX}-windows-amd64.exe"

      - name: Package executable
        shell: pwsh
        env:
          ASSET_PREFIX: ${{ steps.version.outputs.asset_prefix }}
        run: |
          Get-FileHash "dist/$env:ASSET_PREFIX-windows-amd64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $env:ASSET_PREFIX-windows-amd64.exe" } |
            Set-Content "dist/$env:ASSET_PREFIX-windows-amd64.exe.sha256"
          Copy-Item "dist/$env:ASSET_PREFIX-windows-amd64.exe.asc" "dist/ClipForVRChat-user-package/" -Force
          Compress-Archive -Path "dist/ClipForVRChat-user-package/*" -DestinationPath "dist/$env:ASSET_PREFIX-windows-amd64.zip" -Force
          Get-FileHash "dist/$env:ASSET_PREFIX-windows-amd64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $env:ASSET_PREFIX-windows-amd64.zip" } |
            Set-Content "dist/$env:ASSET_PREFIX-windows-amd64.zip.sha256"
          Compress-Archive -Path "dist/ClipForVRChat/*" -DestinationPath "dist/$env:ASSET_PREFIX-windows-amd64-separated.zip" -Force
          Get-FileHash "dist/$env:ASSET_PREFIX-windows-amd64-separated.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $env:ASSET_PREFIX-windows-amd64-separated.zip" } |
            Set-Content "dist/$env:ASSET_PREFIX-windows-amd64-separated.zip.sha256"

      - name: Write build metadata
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ steps.version.outputs.commit_sha }}
          APP_FULL_VERSION: ${{ steps.version.outputs.app_version }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_REVISION: ${{ steps.version.outputs.revision }}
          APP_RELEASE_TIME: ${{ steps.version.outputs.release_time }}
          ASSET_PREFIX: ${{ steps.version.outputs.asset_prefix }}
          SPOUT_HELPER_SHA256: ${{ steps.spout.outputs.helper_sha256 }}
          SPOUT_DLL_SHA256: ${{ steps.spout.outputs.dll_sha256 }}
          AVATARBEACON_PACKAGE_URL: ${{ steps.avatarbeacon.outputs.package_url }}
          AVATARBEACON_PACKAGE_NAME: ${{ steps.avatarbeacon.outputs.package_name }}
          AVATARBEACON_PACKAGE_SHA256: ${{ steps.avatarbeacon.outputs.package_sha256 }}
          AVATARBEACON_PACKAGE_SIGNATURE_URL: ${{ steps.avatarbeacon.outputs.signature_url }}
          AVATARBEACON_PACKAGE_SIGNATURE_NAME: ${{ steps.avatarbeacon.outputs.signature_name }}
          AVATARBEACON_PACKAGE_SIGNATURE_SHA256: ${{ steps.avatarbeacon.outputs.signature_sha256 }}
          RELEASE_SIGNING_FINGERPRINT: ${{ env.RELEASE_SIGNING_FINGERPRINT }}
          RELEASE_SIGNING_KEY_UID: ${{ env.RELEASE_SIGNING_KEY_UID }}
        run: |
          $metadata = [ordered]@{
            tag = $env:TAG_NAME
            commit = $env:COMMIT_SHA
            appVersion = $env:APP_FULL_VERSION
            version = $env:APP_VERSION
            revision = $env:APP_REVISION
            releaseTime = $env:APP_RELEASE_TIME
            goVersion = "${{ env.GO_VERSION }}"
            nodeVersion = "${{ env.NODE_VERSION }}"
            wailsVersion = "${{ env.WAILS_VERSION }}"
            spout = [ordered]@{
              helper = "spout-capture.exe"
              helperSha256 = $env:SPOUT_HELPER_SHA256
              library = "SpoutLibrary.dll"
              librarySha256 = $env:SPOUT_DLL_SHA256
              source = "embedded in main exe and included in separated zip"
            }
            avatarBeacon = [ordered]@{
              package = $env:AVATARBEACON_PACKAGE_NAME
              packageSha256 = $env:AVATARBEACON_PACKAGE_SHA256
              source = $env:AVATARBEACON_PACKAGE_URL
              signature = $env:AVATARBEACON_PACKAGE_SIGNATURE_NAME
              signatureSha256 = $env:AVATARBEACON_PACKAGE_SIGNATURE_SHA256
              signatureSource = $env:AVATARBEACON_PACKAGE_SIGNATURE_URL
              signatureVerifiedWith = [ordered]@{
                uid = $env:RELEASE_SIGNING_KEY_UID
                fingerprint = $env:RELEASE_SIGNING_FINGERPRINT
              }
              distribution = "included in normal and separated zip"
            }
          }
          $metadata | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 "dist/$env:ASSET_PREFIX-build-metadata.json"
          Remove-Item "dist/$env:AVATARBEACON_PACKAGE_SIGNATURE_NAME" -Force

      - name: Validate release assets
        shell: pwsh
        env:
          ASSET_PREFIX: ${{ steps.version.outputs.asset_prefix }}
          TAG_NAME: ${{ steps.version.outputs.version }}
          AVATARBEACON_PACKAGE_NAME: ${{ env.AVATARBEACON_PACKAGE_NAME }}
        run: |
          $distRoot = (Resolve-Path "dist").Path
          $expectedUserZipSignature = "$env:ASSET_PREFIX-windows-amd64.exe.asc"
          $expectedAvatarBeaconPackage = $env:AVATARBEACON_PACKAGE_NAME
          $unexpected = Get-ChildItem dist -Recurse -File | Where-Object {
            $_.Name -like "*release-signing-public-key.asc" -or
            $_.Name -like "AvatarBeacon-*-source.zip" -or
            $_.Name -like "AvatarBeacon-*-source.zip.sha256" -or
            ($_.DirectoryName -eq $distRoot -and $_.Extension -eq ".asc" -and $_.Name -ne $expectedUserZipSignature) -or
            ($_.FullName -like "*\dist\ClipForVRChat\*" -and $_.Extension -eq ".asc") -or
            ($_.FullName -like "*\dist\ClipForVRChat-user-package\*" -and $_.Extension -eq ".asc" -and $_.Name -ne $expectedUserZipSignature)
          }
          if ($unexpected) {
            $unexpected | ForEach-Object { Write-Error "Unexpected file in release output: $($_.FullName)" }
            throw "Unexpected release output files were found"
          }
          $zipCheckDir = Join-Path $env:RUNNER_TEMP "release-zip-check"
          Remove-Item -Recurse -Force $zipCheckDir -ErrorAction SilentlyContinue
          $userZipCheckDir = Join-Path $env:RUNNER_TEMP "release-user-zip-check"
          Remove-Item -Recurse -Force $userZipCheckDir -ErrorAction SilentlyContinue
          Expand-Archive "dist/$env:ASSET_PREFIX-windows-amd64.zip" -DestinationPath $userZipCheckDir
          Expand-Archive "dist/$env:ASSET_PREFIX-windows-amd64-separated.zip" -DestinationPath $zipCheckDir
          $unexpectedUserZipFiles = Get-ChildItem $userZipCheckDir -Recurse -File | Where-Object {
            $_.Name -like "*release-signing-public-key.asc" -or
            ($_.Extension -eq ".asc" -and $_.Name -ne $expectedUserZipSignature) -or
            ($_.Extension -eq ".unitypackage" -and $_.Name -ne $expectedAvatarBeaconPackage) -or
            $_.Name -in @("spout-capture.exe", "SpoutLibrary.dll", "Spout2-LICENSE.txt")
          }
          if ($unexpectedUserZipFiles) {
            $unexpectedUserZipFiles | ForEach-Object { Write-Error "Unexpected file in normal release zip: $($_.FullName)" }
            throw "Unexpected files were found in normal release zip"
          }
          $unexpectedSeparatedZipFiles = Get-ChildItem $zipCheckDir -Recurse -File | Where-Object {
            $_.Name -like "*release-signing-public-key.asc" -or
            $_.Name -like "AvatarBeacon-*-source.zip" -or
            $_.Extension -eq ".asc" -or
            ($_.Extension -eq ".unitypackage" -and $_.Name -ne $expectedAvatarBeaconPackage)
          }
          if ($unexpectedSeparatedZipFiles) {
            $unexpectedSeparatedZipFiles | ForEach-Object { Write-Error "Unexpected file in separated release zip: $($_.FullName)" }
            throw "Unexpected files were found in separated release zip"
          }
          & "dist/ClipForVRChat/spout-capture.exe" --help
          & "dist/ClipForVRChat/spout-capture.exe" --version
          & "dist/ClipForVRChat/spout-capture.exe" --list-senders
          $required = @(
            "dist/$env:ASSET_PREFIX-windows-amd64.exe",
            "dist/$env:ASSET_PREFIX-windows-amd64.exe.sha256",
            "dist/$env:ASSET_PREFIX-windows-amd64.exe.asc",
            "dist/$env:ASSET_PREFIX-windows-amd64.zip",
            "dist/$env:ASSET_PREFIX-windows-amd64.zip.sha256",
            "dist/$env:ASSET_PREFIX-windows-amd64-separated.zip",
            "dist/$env:ASSET_PREFIX-windows-amd64-separated.zip.sha256",
            "dist/$expectedAvatarBeaconPackage",
            "dist/$env:ASSET_PREFIX-build-metadata.json",
            "dist/ClipForVRChat/ClipForVRChat.exe",
            "dist/ClipForVRChat/README.md",
            "dist/ClipForVRChat/LICENSE",
            "dist/ClipForVRChat/Release-signing-public-key.url",
            "dist/ClipForVRChat/$expectedAvatarBeaconPackage",
            "dist/ClipForVRChat/spout-capture.exe",
            "dist/ClipForVRChat/SpoutLibrary.dll",
            "dist/ClipForVRChat/Spout2-LICENSE.txt"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) {
              throw "Required release output was not created: $path"
            }
          }
          $requiredZip = @(
            "ClipForVRChat.exe",
            "README.md",
            "LICENSE",
            "Release-signing-public-key.url",
            "$env:ASSET_PREFIX-windows-amd64.exe.asc",
            "$expectedAvatarBeaconPackage"
          )
          foreach ($name in $requiredZip) {
            if (!(Test-Path (Join-Path $userZipCheckDir $name))) {
              throw "Required normal release zip file was not created: $name"
            }
          }
          $requiredSeparatedZip = @(
            "ClipForVRChat.exe",
            "README.md",
            "LICENSE",
            "Release-signing-public-key.url",
            "spout-capture.exe",
            "SpoutLibrary.dll",
            "Spout2-LICENSE.txt",
            "$expectedAvatarBeaconPackage"
          )
          foreach ($name in $requiredSeparatedZip) {
            if (!(Test-Path (Join-Path $zipCheckDir $name))) {
              throw "Required separated release zip file was not created: $name"
            }
          }
          $exeHashLine = Get-Content "dist/$env:ASSET_PREFIX-windows-amd64.exe.sha256"
          $exeHash = (Get-FileHash "dist/$env:ASSET_PREFIX-windows-amd64.exe" -Algorithm SHA256).Hash.ToLower()
          if ($exeHashLine -ne "$exeHash  $env:ASSET_PREFIX-windows-amd64.exe") {
            throw "main exe sha256 file does not match"
          }
          $zipHashLine = Get-Content "dist/$env:ASSET_PREFIX-windows-amd64.zip.sha256"
          $zipHash = (Get-FileHash "dist/$env:ASSET_PREFIX-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower()
          if ($zipHashLine -ne "$zipHash  $env:ASSET_PREFIX-windows-amd64.zip") {
            throw "normal release zip sha256 file does not match"
          }
          $allowedUserZip = @(
            "ClipForVRChat.exe",
            "README.md",
            "LICENSE",
            "Release-signing-public-key.url",
            "$env:ASSET_PREFIX-windows-amd64.exe.asc",
            "$expectedAvatarBeaconPackage"
          )
          $actualUserZipFiles = Get-ChildItem $userZipCheckDir -Recurse -File
          $extraUserZip = $actualUserZipFiles | Where-Object {
            $_.DirectoryName -ne $userZipCheckDir -or $_.Name -notin $allowedUserZip
          }
          if ($extraUserZip) {
            $extraUserZip | ForEach-Object { Write-Error "Unexpected normal release zip file: $($_.FullName)" }
            throw "Unexpected files were found in normal release zip"
          }
          $allowedSeparatedZip = @(
            "ClipForVRChat.exe",
            "README.md",
            "LICENSE",
            "Release-signing-public-key.url",
            "spout-capture.exe",
            "SpoutLibrary.dll",
            "Spout2-LICENSE.txt",
            "$expectedAvatarBeaconPackage"
          )
          $actualSeparatedZipFiles = Get-ChildItem $zipCheckDir -Recurse -File
          $extraSeparatedZip = $actualSeparatedZipFiles | Where-Object {
            $_.DirectoryName -ne $zipCheckDir -or $_.Name -notin $allowedSeparatedZip
          }
          if ($extraSeparatedZip) {
            $extraSeparatedZip | ForEach-Object { Write-Error "Unexpected separated release zip file: $($_.FullName)" }
            throw "Unexpected files were found in separated release zip"
          }

      - name: Prepare release notes
        if: steps.version.outputs.draft == 'false'
        env:
          TAG_NAME: ${{ steps.version.outputs.version }}
        run: node scripts/extract-release-notes.mjs "$env:TAG_NAME" RELEASE_NOTES.md dist/release-body.md --fallback-rc-notes

      - name: Prepare draft release notes
        if: steps.version.outputs.draft == 'true'
        env:
          TAG_NAME: ${{ steps.version.outputs.version }}
        run: node scripts/extract-release-notes.mjs "$env:TAG_NAME" RELEASE_NOTES.md dist/release-body.md --fallback-draft-notes

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-${{ steps.version.outputs.asset_prefix }}
          path: |
            dist/${{ steps.version.outputs.asset_prefix }}-windows-amd64.exe.asc
            dist/${{ steps.version.outputs.asset_prefix }}-windows-amd64.zip
            dist/${{ steps.version.outputs.asset_prefix }}-windows-amd64-separated.zip
            dist/release-body.md

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download release assets artifact
        uses: actions/download-artifact@v7
        with:
          name: release-assets-${{ needs.build.outputs.asset_prefix }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
          DRAFT: ${{ needs.build.outputs.draft }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            --title "$TAG_NAME"
            --notes-file dist/release-body.md
          )
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" "${args[@]}"
          else
            gh release create "$TAG_NAME" "${args[@]}"
          fi
          allowed_assets=(
            "ClipForVRChat-${TAG_NAME}-windows-amd64.zip"
            "ClipForVRChat-${TAG_NAME}-windows-amd64.exe.asc"
            "ClipForVRChat-${TAG_NAME}-windows-amd64-separated.zip"
          )
          mapfile -t existing_assets < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          for asset in "${existing_assets[@]}"; do
            keep=false
            for allowed in "${allowed_assets[@]}"; do
              if [[ "$asset" == "$allowed" ]]; then
                keep=true
                break
              fi
            done
            if [[ "$keep" == "false" ]]; then
              gh release delete-asset "$TAG_NAME" "$asset" --yes
            fi
          done
          gh release upload "$TAG_NAME" --clobber \
            "dist/ClipForVRChat-${TAG_NAME}-windows-amd64.zip" \
            "dist/ClipForVRChat-${TAG_NAME}-windows-amd64.exe.asc" \
            "dist/ClipForVRChat-${TAG_NAME}-windows-amd64-separated.zip"
